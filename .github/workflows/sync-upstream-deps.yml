name: Sync upstream dependencies

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:      # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies from upstream
        id: sync
        run: |
          python scripts/sync_upstream_deps.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          if git diff --staged --quiet; then
            echo "No dependency changes — nothing to commit."
          else
            git commit -m "chore(deps): sync dependencies from upstream sooperset/mcp-atlassian"
            git push
            echo "Committed and pushed."
          fi
