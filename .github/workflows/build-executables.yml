name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller>=6.0.0

      - name: Build executable (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile \
            --name mcp-atlassian \
            --console \
            --hidden-import atlassian \
            --hidden-import mcp \
            --hidden-import fastmcp \
            --hidden-import pydantic \
            --hidden-import pydantic_core \
            --hidden-import pydantic.fields \
            --hidden-import pydantic._internal._model_construction \
            --hidden-import pydantic._internal._fields \
            --hidden-import pydantic_settings \
            --hidden-import trio \
            --hidden-import click \
            --hidden-import beautifulsoup4 \
            --hidden-import markdownify \
            --hidden-import markdown \
            --hidden-import dotenv \
            --hidden-import thefuzz \
            --hidden-import dateutil \
            --hidden-import keyring \
            --hidden-import cachetools \
            --collect-all fastmcp \
            --collect-all pydantic \
            --collect-all mcp \
            --copy-metadata pydantic \
            --copy-metadata pydantic_core \
            --copy-metadata fastmcp \
            --copy-metadata mcp \
            src/mcp_atlassian/__init__.py
          chmod +x dist/mcp-atlassian
          mv dist/mcp-atlassian dist/mcp-atlassian-mac

      - name: Test executable (Unix)
        if: runner.os != 'Windows'
        run: |
          # Test that the executable can at least show help without crashing
          dist/mcp-atlassian-mac --help || (echo "Executable failed to run!" && exit 1)

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile `
            --name mcp-atlassian `
            --console `
            --hidden-import atlassian `
            --hidden-import mcp `
            --hidden-import fastmcp `
            --hidden-import pydantic `
            --hidden-import pydantic_core `
            --hidden-import pydantic.fields `
            --hidden-import pydantic._internal._model_construction `
            --hidden-import pydantic._internal._fields `
            --hidden-import pydantic_settings `
            --hidden-import trio `
            --hidden-import click `
            --hidden-import beautifulsoup4 `
            --hidden-import markdownify `
            --hidden-import markdown `
            --hidden-import dotenv `
            --hidden-import thefuzz `
            --hidden-import dateutil `
            --hidden-import keyring `
            --hidden-import cachetools `
            --collect-all fastmcp `
            --collect-all pydantic `
            --collect-all mcp `
            --copy-metadata pydantic `
            --copy-metadata pydantic_core `
            --copy-metadata fastmcp `
            --copy-metadata mcp `
            src/mcp_atlassian/__init__.py
          Rename-Item dist/mcp-atlassian.exe mcp-atlassian-windows.exe

      - name: Test executable (Windows)
        if: runner.os == 'Windows'
        run: |
          # Test that the executable can at least show help without crashing
          dist/mcp-atlassian-windows.exe --help
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Executable failed to run!"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mcp-atlassian-${{ matrix.os }}
          path: |
            dist/mcp-atlassian-mac
            dist/mcp-atlassian-windows.exe
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mcp-atlassian-mac
            dist/mcp-atlassian-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
