name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile \
            --name mcp-atlassian \
            --console \
            --hidden-import atlassian \
            --hidden-import mcp \
            --hidden-import fastmcp \
            --hidden-import pydantic \
            --hidden-import pydantic_core \
            --hidden-import trio \
            --hidden-import click \
            --hidden-import beautifulsoup4 \
            --hidden-import markdownify \
            --hidden-import markdown \
            --hidden-import dotenv \
            --hidden-import thefuzz \
            --hidden-import dateutil \
            --hidden-import keyring \
            --hidden-import cachetools \
            --collect-all fastmcp \
            --collect-all pydantic \
            --collect-all mcp \
            src/mcp_atlassian/__init__.py
          chmod +x dist/mcp-atlassian
          mv dist/mcp-atlassian dist/mcp-atlassian-mac

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile `
            --name mcp-atlassian `
            --console `
            --hidden-import atlassian `
            --hidden-import mcp `
            --hidden-import fastmcp `
            --hidden-import pydantic `
            --hidden-import pydantic_core `
            --hidden-import trio `
            --hidden-import click `
            --hidden-import beautifulsoup4 `
            --hidden-import markdownify `
            --hidden-import markdown `
            --hidden-import dotenv `
            --hidden-import thefuzz `
            --hidden-import dateutil `
            --hidden-import keyring `
            --hidden-import cachetools `
            --collect-all fastmcp `
            --collect-all pydantic `
            --collect-all mcp `
            src/mcp_atlassian/__init__.py
          Rename-Item dist/mcp-atlassian.exe mcp-atlassian-windows.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-atlassian-${{ matrix.os }}
          path: |
            dist/mcp-atlassian-mac
            dist/mcp-atlassian-windows.exe
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/mcp-atlassian-mac
            dist/mcp-atlassian-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
